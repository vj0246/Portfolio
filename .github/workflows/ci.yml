name: CI

# Catches the two ways this site breaks: a card edited in index.html instead of
# in content/projects (so the build output no longer matches the source of truth),
# and a structural regression such as an unbalanced tag or a dead anchor.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cards in index.html match content/projects
        run: python scripts/build.py --check

      - name: Structure and accessibility invariants
        run: python scripts/validate.py

      - name: JavaScript parses
        run: |
          node --check js/main.js
          node --check js/github.js
