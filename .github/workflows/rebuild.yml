name: Rebuild cards

# The admin writes JSON straight to content/ and never touches index.html, so
# something has to render it. That is this. It keeps content/ as the single
# source of truth: whatever is committed there is what the page shows, whether
# it arrived from the admin or from a laptop.
#
# If validate.py fails, the job stops before committing, and the live site
# stays on its previous version rather than shipping a broken page.

on:
  push:
    branches: [ main ]
    paths:
      - 'content/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render cards and experience into index.html
        run: python scripts/build.py

      - name: Validate the result
        run: python scripts/validate.py

      - name: Commit index.html if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && exit 0
          git commit -m "chore(build): render content [skip ci]"
          # the daily data sync may have pushed meanwhile; it touches a different file
          git pull --rebase origin main
          git push
