<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Editor · Vivaan Jain</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

<header class="bar">
  <div class="bar-left">
    <span class="bar-title">Portfolio editor</span>
    <span class="bar-repo" id="repoLabel"></span>
  </div>
  <div class="bar-right">
    <a class="bar-link" href="/" target="_blank" rel="noopener">View site ↗</a>
    <span class="who" id="who"></span>
    <button type="button" class="btn ghost small" id="logout" hidden>Sign out</button>
  </div>
</header>

<section class="gate" id="gate" hidden>
  <h1>Sign in to edit the site</h1>
  <p>
    Use your GitHub account. Only accounts the site owner has approved can sign in,
    and every change you save is recorded on GitHub with your name.
  </p>
  <p class="gate-error" id="gateError" hidden></p>
  <a class="btn primary" href="/api/auth/login">Continue with GitHub</a>
</section>

<main class="app" id="app" hidden>
  <aside class="list">
    <div class="tabs" role="tablist" aria-label="What to edit">
      <button type="button" class="tab active" data-tab="projects" role="tab" aria-selected="true">Projects</button>
      <button type="button" class="tab" data-tab="experience" role="tab" aria-selected="false">Experience</button>
      <button type="button" class="tab" data-tab="resume" role="tab" aria-selected="false">Resume</button>
    </div>
    <div id="listBody" class="card-list"></div>
  </aside>

  <section class="editor" id="editor" aria-live="polite"></section>
</main>

<script src="/admin/admin.js" defer></script>
</body>
</html>
